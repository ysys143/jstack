[tool.claude-hooks]
# Formatting staged files invalidates frozen contract snapshots; keep checks enabled.
auto_format = false

[tool.ruff]
# Embedded upstream repositories own their own rules; lint jstack-authored Python.
extend-exclude = [".git", "**/repos/**"]
force-exclude = true

[tool.ruff.lint]
# Start with correctness checks that pass on the current jstack source tree.
select = ["E9", "F63", "F7", "F82"]
